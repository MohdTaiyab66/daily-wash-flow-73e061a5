apply plugin: 'com.android.application'

android {
    namespace = "com.urbanwash.customer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.urbanwash.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "1.0.32"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// [uw-payments] PERMANENT — do not move into a patch script.
// Single, deterministic Razorpay Android SDK version for every module. The
// upstream capacitor-razorpay plugin (which used a dynamic `1.6.+` range) has
// been removed; the native checkout lives in
// android/app/src/main/java/com/urbanwash/payments/UrbanWashCheckoutPlugin.java
//
// Razorpay renamed the published artifact: the current Android Checkout SDK is
// `com.razorpay:standard-core` (latest 1.7.18). The legacy
// `com.razorpay:checkout` artifact stopped at 1.6.41. Same `com.razorpay.*`
// classes, no code changes required.
ext.razorpayCheckoutVersion = '1.7.18'

dependencies {
    implementation "com.razorpay:standard-core:1.7.18"
}

configurations.all {
    resolutionStrategy {
        force 'com.razorpay:standard-core:1.7.18'
        // Fail fast if anything ever reintroduces a dynamic Razorpay version.
        eachDependency { details ->
            if (details.requested.group == 'com.razorpay' && details.requested.name in ['checkout', 'standard-core']) {
                if (details.requested.version?.contains('+')) {
                    throw new GradleException("Dynamic Razorpay version requested (" + details.requested.version + "); only 1.7.18 is allowed")
                }
                if (details.requested.name == 'standard-core') {
                    details.useVersion '1.7.18'
                }
            }
        }
    }
}

task printRazorpayResolved {
    doLast {
        configurations.findAll { it.canBeResolved }.each { cfg ->
            try {
                cfg.resolvedConfiguration.resolvedArtifacts.each { a ->
                    def id = a.moduleVersion.id
                    if (id.group == 'com.razorpay') {
                        println "[uw-razorpay-resolved] " + cfg.name + " -> " + id.group + ":" + id.name + ":" + id.version
                    }
                }
            } catch (Exception ignored) {}
        }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


















